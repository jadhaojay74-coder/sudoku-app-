  <script>
    const manifest = {
      name: "Sudoku Master Pro",
      short_name: "Sudoku",
      start_url: "./",
      display: "standalone",
      background_color: "#1a1a2e",
      theme_color: "#3498db",
      icons: [{ src: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧩</text></svg>", sizes: "192x192 512x512", type: "image/svg+xml" }]
    };
    const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = URL.createObjectURL(blob);
    document.head.appendChild(link);
  </script>
  
</head>
<body>

  <!-- Header Navigation -->
  <header>
    <div class="brand">
      <span class="logo-icon">🧩</span>
      <span class="logo-text">Sudoku Master</span>
    </div>

    <nav class="nav-links">
      <button class="nav-btn active" onclick="switchTab('game-view', this)">Play</button>
      <button class="nav-btn" onclick="switchTab('status-view', this)">Status 📉</button>
      <button class="nav-btn" onclick="switchTab('settings-view', this)">Settings</button>
    </nav>

    <div class="header-actions">
      <button class="install-btn" id="install-btn" onclick="installPWA()">📲 Install</button>
      <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn">🌙 Dark</button>
    </div>
  </header>

  <main class="container">
    <!-- Game View -->
    <section id="game-view" class="view active">
      <div class="game-header">
        <div class="select-group">
          <select id="grid-size" onchange="changeGridMode()">
            <option value="9x9" selected>9×9 Classic (Digits 1-9)</option>
            <option value="3x3">3×3 Mini (Digits 1-3)</option>
          </select>

          <select id="difficulty" onchange="startNewGame()">
            <option value="simple">Simple</option>
            <option value="medium" selected>Medium</option>
            <option value="hard">Hard</option>
            <option value="expert">Expert (2 Mistakes Max)</option>
          </select>
        </div>

        <div class="stats-group">
          <div class="stat-badge">⏱️ <span id="timer">00:00</span></div>
          <div class="stat-badge danger-text">❌ <span id="mistake-count">0/3</span></div>
          <div class="stat-badge">💡 Hints: <span id="hint-count">3</span></div>
        </div>
      </div>

      <!-- Sudoku Board Wrapper -->
      <div class="board-wrapper">
        <div class="board-container grid-9x9" id="board-container">
          <div class="overlay-screen" id="game-overlay"></div>
        </div>
      </div>

      <!-- Controls Grid -->
      <div class="controls-grid">
        <button class="btn btn-primary" onclick="startNewGame()">New Game 🔄</button>
        <button class="btn" onclick="togglePause()" id="pause-btn">Pause ⏸️</button>
        <button class="btn" onclick="toggleNoteMode()" id="note-btn">Note ✏️ (OFF)</button>
        <button class="btn" onclick="useHint()" id="hint-btn">Hint 💡</button>
        <button class="btn" onclick="eraseCell()">Erase 🧽</button>
      </div>

      <!-- Numpad -->
      <div class="numpad" id="numpad"></div>

      <div class="keyboard-info">
        💡 <b>Keyboard:</b> <kbd>Arrows</kbd> Move | <kbd>1-9</kbd> Enter Number | <kbd>Backspace</kbd> Erase | <kbd>N</kbd> Pencil Note | <kbd>P</kbd> Pause
      </div>
    </section>

    <!-- Status View -->
    <div id="status-tab" class="tab-content">
  <h2>Performance Analytics 📈</h2>
  <p>Score rating increases on Win and drops on Loss.</p>

  <label for="difficulty-select">Difficulty:</label>
  <select id="difficulty-select">
    <option value="Simple">Simple</option>
    <option value="Medium" selected>Medium</option>
    <option value="Hard">Hard</option>
    <option value="Expert">Expert</option>
  </select>

  <!-- Canvas wrapper with non-zero container -->
  <div class="chart-container">
    <canvas id="analyticsChart"></canvas>
  </div>
    </div>

    <!-- Settings View -->
    <section id="settings-view" class="view">
      <div class="card">
        <h2>Game Settings ⚙️</h2>
        
        <div class="setting-row">
          <span>🔊 Sound Effects</span>
          <label class="switch">
            <input type="checkbox" id="sound-toggle" onchange="toggleSoundSetting(this.checked)" checked>
            <span class="slider"></span>
          </label>
        </div>

        <div class="setting-row">
          <span>📳 Haptic Vibration</span>
          <label class="switch">
            <input type="checkbox" id="vibe-toggle" onchange="toggleVibeSetting(this.checked)" checked>
            <span class="slider"></span>
          </label>
        </div>

        <hr />

        <div class="settings-actions">
          <button class="btn btn-danger" onclick="clearSavedData()">🗑️ Reset Memory & Stats</button>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
  </body>
    
</html>
