<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sudoku Master Pro</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<canvas id="confetti-canvas"></canvas>

<div class="container">
  <header>
    <h1>Sudoku</h1>
    <button class="theme-btn" id="theme-toggle">🌙 Dark</button>
  </header>

  <div class="status-bar">
    <div class="status-item">
      <span>Mode:</span>
      <select id="difficulty">
        <option value="easy">Easy</option>
        <option value="medium" selected>Medium</option>
        <option value="hard">Hard</option>
      </select>
    </div>
    <div class="status-item">
      <span>Mistakes:</span>
      <strong id="mistakes-count" class="mistake-text">0/3</strong>
    </div>
    <div class="status-item">
      <span>Time:</span>
      <strong id="timer">00:00</strong>
    </div>
  </div>

  <div class="game-mode-banner" id="game-mode-banner">Standard Game</div>

  <div class="board-wrapper">
    <div class="board" id="board"></div>
    <div class="pause-overlay" id="pause-overlay">PAUSED</div>
  </div>

  <div class="action-buttons">
    <button class="btn" id="btn-pause">Pause</button>
    <button class="btn" id="btn-notes">Notes (OFF)</button>
    <button class="btn" id="btn-undo">Undo (2)</button>
    <button class="btn" id="btn-hint">Hint (2)</button>
    <button class="btn" id="btn-erase">Erase</button>
    <button class="btn btn-secondary" id="btn-daily">Calendar</button>
    <button class="btn btn-secondary" id="btn-rewards">Rewards</button>
    <button class="btn btn-secondary" id="btn-stats">Stats</button>
    <button class="btn btn-secondary" id="btn-new">New</button>
  </div>

  <div class="keypad" id="keypad"></div>
</div>

<div class="modal-overlay" id="calendar-modal">
  <div class="modal-content calendar-modal-content">
    <div class="calendar-header">
      <button class="btn btn-secondary" id="cal-prev-month">&lt;</button>
      <h3 id="calendar-month-title">August 2026</h3>
      <button class="btn btn-secondary" id="cal-next-month">&gt;</button>
    </div>
    <div class="calendar-weekdays">
      <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
    </div>
    <div class="calendar-grid" id="calendar-grid"></div>
    <button class="btn modal-btn" id="calendar-close-btn">Close</button>
  </div>
</div>

<div class="modal-overlay" id="rewards-modal">
  <div class="modal-content">
    <h2>🏆 Trophy Room</h2>
    <p class="rewards-subtitle">Complete all daily challenges in a month to earn a trophy!</p>
    <div class="trophy-grid" id="trophy-grid"></div>
    <button class="btn modal-btn" id="rewards-close-btn">Close</button>
  </div>
</div>

<div class="modal-overlay" id="game-modal">
  <div class="modal-content">
    <h2 id="modal-title">Game Over</h2>
    <p id="modal-message">You reached 3 mistakes!</p>
    <button class="btn modal-btn" id="modal-close-btn">Play Again</button>
  </div>
</div>

<div class="modal-overlay" id="stats-modal">
  <div class="modal-content">
    <h2>Performance Analysis</h2>
    <div class="stats-grid">
      <div class="stat-card">
        <span class="stat-number" id="stat-played">0</span>
        <span class="stat-label">Played</span>
      </div>
      <div class="stat-card">
        <span class="stat-number" id="stat-won">0</span>
        <span class="stat-label">Won</span>
      </div>
      <div class="stat-card">
        <span class="stat-number" id="stat-winrate">0%</span>
        <span class="stat-label">Win Rate</span>
      </div>
      <div class="stat-card">
        <span class="stat-number" id="stat-besttime">--:--</span>
        <span class="stat-label">Best Time</span>
      </div>
    </div>
    <button class="btn modal-btn" id="stats-close-btn">Close</button>
  </div>
</div>

<script src="script.js"></script>
</body>
  </html>
