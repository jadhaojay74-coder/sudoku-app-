<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sudoku Master Ultimate</title>
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧩</text></svg>">
  <link rel="stylesheet" href="styles.css">

  <img src="images/sudoku-logo.png" alt="SUDOKU MASTER">
  <img src="images/logo.webp" alt="SUDOKU MASTER">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <!-- Navigation Header -->
  <header>
    <div class="brand">
      <span class="logo-icon">🧩</span>
      <span class="logo-text">Sudoku Master</span>
    </div>

    <nav class="nav-links">
      <button class="nav-btn active" data-target="game-view">Play</button>
      <button class="nav-btn" data-target="status-view">Status 📉</button>
      <button class="nav-btn" data-target="settings-view">Settings</button>
    </nav>

    <div class="header-actions">
      <button class="theme-toggle" id="theme-btn">🌙</button>
    </div>
  </header>

  <main class="container">

    <!-- Game View -->
    <section id="game-view" class="view active">
      <div class="game-header">
        <div class="select-group">
          <select id="grid-size">
            <option value="4x4">4×4 Mini</option>
            <option value="6x6">6×6 Medium</option>
            <option value="9x9" selected>9×9 Classic</option>
            <option value="12x12">12×12 Giant</option>
            <option value="16x16">16×16 Monster</option>
          </select>

          <select id="variant-type">
            <option value="classic" selected>Standard Numbers</option>
            <option value="alphabet">Alphabet</option>
          </select>

          <select id="difficulty">
            <option value="simple">Simple</option>
            <option value="medium" selected>Medium</option>
            <option value="hard">Hard</option>
            <option value="expert">Expert</option>
          </select>
        </div>

        <div class="stats-group">
          <div class="stat-badge">⏱️ <span id="timer">00:00</span></div>
          <div class="stat-badge danger-text">❌ <span id="mistakes">0/3</span></div>
          <div class="stat-badge">💡 Hints: <span id="hint-count">3</span></div>
        </div>
      </div>

      <!-- Sudoku Board Wrapper -->
      <div class="board-wrapper">
        <div class="board-container grid-9x9" id="board-container"></div>
      </div>

      <!-- Action Controls -->
      <div class="controls-grid">
        <button class="btn" id="new-game-btn">New 🔄</button>
        <button class="btn" id="pause-btn">Pause ⏸️</button>
        <button class="btn" id="note-btn">Notes OFF</button>
        <button class="btn" id="hint-btn">Hint 💡</button>
        <button class="btn" id="erase-btn">Erase 🧽</button>
      </div>

      <!-- Keypad -->
      <div class="numpad" id="numpad"></div>

      <div class="keyboard-info">
        💡 <b>Keyboard:</b> <kbd>Arrows</kbd> Move | <kbd>1-9 / A-P</kbd> Enter Value | <kbd>Backspace</kbd> Erase | <kbd>N</kbd> Notes
      </div>
    </section>

    <!-- Status / Analytics View -->
    <section id="status-view" class="view">
      <div class="tab-content">
        <h2>Performance Analytics 📈</h2>
        <p style="margin-top: 4px; color: var(--text-muted); font-size: 0.85rem;">
          Track your average completion times and win rates.
        </p>

        <div class="setting-row" style="margin-top: 12px;">
          <label for="difficulty-select">Filter Mode:</label>
          <select id="difficulty-select" style="max-width: 140px;">
            <option value="4x4">4×4 Mini</option>
            <option value="6x6">6×6 Medium</option>
            <option value="9x9" selected>9×9 Classic</option>
            <option value="12x12">12×12 Giant</option>
            <option value="16x16">16×16 Monster</option>
          </select>
        </div>

        <div class="chart-container">
          <canvas id="analyticsChart"></canvas>
        </div>
      </div>
    </section>

    <!-- Settings View -->
    <section id="settings-view" class="view">
      <div class="card">
        <h2>Game Settings ⚙️</h2>
        
        <div class="setting-row">
          <span>Dark Mode Theme</span>
          <label class="switch">
            <input type="checkbox" id="theme-switch">
            <span class="slider"></span>
          </label>
        </div>

        <div class="setting-row">
          <span>🔊 Sound Effects</span>
          <label class="switch">
            <input type="checkbox" id="sound-toggle" checked>
            <span class="slider"></span>
          </label>
        </div>

        <div class="setting-row">
          <span>📳 Haptic Vibration</span>
          <label class="switch">
            <input type="checkbox" id="vibe-toggle" checked>
            <span class="slider"></span>
          </label>
        </div>

        <hr style="border: 0; border-top: 1px solid var(--border-light);" />

        <button class="btn-danger" id="reset-data-btn">🗑️ Reset Memory & Stats</button>
      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
